<svg xmlns="http://www.w3.org/2000/svg" width="440" height="150" viewBox="0 0 440 150">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b2e"/>
      <stop offset="1" stop-color="#0b0f1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="438" height="148" rx="18"/></clipPath>
  </defs>
  <style>
    .shine { animation: sweep 6s ease-in-out infinite; }
    @keyframes sweep { 0%, 60% { transform: translateX(-200px); } 100% { transform: translateX(640px); } }
    .title { font: 700 20px -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #f8fafc; }
    .desc { font: 400 13.5px -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #94a3b8; }
    .tag { font: 700 10.5px -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; letter-spacing: 1px; fill: #f59e0b; }
    .open { font: 600 12px -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #cbd5e1; }
  </style>
  <g clip-path="url(#clip)">
    <rect width="440" height="150" fill="url(#bg)"/>
    <rect width="440" height="150" fill="url(#glow)"/>
    <rect width="5" height="150" fill="url(#accent)"/>
    <rect class="shine" x="0" y="0" width="160" height="150" fill="url(#shine)" transform="skewX(-20)"/>
  </g>
  <rect x="1" y="1" width="438" height="148" rx="18" fill="none" stroke="url(#accent)" stroke-opacity="0.55" stroke-width="1.5"/>

  <rect x="26" y="33" width="84" height="84" rx="20" fill="url(#accent)" opacity="0.9"/>
  <rect x="30" y="37" width="76" height="76" rx="17" fill="#ffffff"/>
  <image x="42" y="49" width="52" height="52" href="data:image/svg+xml;base64,"/>

  <rect x="132" y="28" width="68" height="20" rx="10" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.45"/>
  <text class="tag" x="166" y="42" text-anchor="middle">UTILITY</text>
  <text class="title" x="132" y="76">Clock</text>
  <text class="desc" x="132" y="100">An easy-to-read analog</text>
  <text class="desc" x="132" y="119">+ digital clock.</text>
  <text class="open" x="418" y="134" text-anchor="end">Open ↗</text>
</svg>
